apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapper
  namespace: link-tracker
  labels:
    app: scrapper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrapper
  template:
    metadata:
      labels:
        app: scrapper
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: link-tracker-config
                  key: POSTGRES_USER
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: scrapper
          image: scrapper:1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: link-tracker-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: link-tracker-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: link-tracker-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: link-tracker-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: link-tracker-secret
                  key: GITHUB_TOKEN
            - name: STACKOVERFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: link-tracker-secret
                  key: STACKOVERFLOW_API_KEY
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scrapper
  namespace: link-tracker
  labels:
    app: scrapper
spec:
  type: NodePort
  selector:
    app: scrapper
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30081
