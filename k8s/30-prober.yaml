apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  namespace: link-tracker
  labels:
    app: prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  template:
    metadata:
      labels:
        app: prober
      # Victoria Metrics находит под по этим аннотациям (service discovery)
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: prober
          # Тот же образ, что и у scrapper: в нём лежат оба бинарника
          image: scrapper:1.3
          imagePullPolicy: IfNotPresent
          command: ["/prober"]
          ports:
            - name: metrics
              containerPort: 9091
          env:
            # Проба идёт через Service, как у настоящего клиента:
            # запросы распределяются по всем репликам scrapper
            - name: PROBE_TARGET_URL
              value: "http://scrapper:8081"
            - name: PROBE_INTERVAL
              value: "5s"
            - name: PROBE_TIMEOUT
              value: "2s"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi